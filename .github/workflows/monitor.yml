name: flight-monitor

# Near-real-time monitoring in GitHub's cloud — no Mac required.
# Each scheduled run starts a job that polls every ~60s for ~55 minutes, then
# exits; the next hourly job continues. State is kept in the Actions cache
# (NOT committed to this public repo), so no personal data is ever exposed.
# Personal flight data + credentials come from encrypted repo secrets.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "serve = ~55-min live loop; once = single cycle; test = send a test alert"
        default: serve
        type: choice
        options: [serve, once, test]
  schedule:
    # Continuous cover: each job serves for ~2h55m and the concurrency group
    # keeps exactly one alive, so this cron is really a handoff/watchdog tick —
    # while a job is running the new run just waits and starts the instant the
    # old one exits (no window boundary to fall through), and if a job ever
    # dies the next tick revives it within ~30 min.
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Must exceed SERVE_MAX_SEC below so the loop exits on its own terms and
    # the state-saving step still runs. Hosted runners cap a job at 6h.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flight-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          # Primary channel; set the NOTIFY_CHANNEL repo variable to "telegram"
          # to switch. Whichever is not primary is used as an automatic fallback
          # if it is configured, so a throttled channel can't swallow an alert.
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'whatsapp' }}
          # ~2h55m, comfortably inside the job timeout above. State is cached
          # when the job ends, so this also bounds how much state a hard runner
          # failure could cost.
          SERVE_MAX_SEC: "10500"
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          FLIGHTS_JSON: ${{ secrets.FLIGHTS_JSON }}
        run: |
          mode="${{ github.event.inputs.mode }}"
          mode="${mode:-serve}"
          python monitor.py --$mode

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}-${{ github.run_attempt }}
