name: flight-monitor

# Near-real-time monitoring in GitHub's cloud — no Mac required.
# Each scheduled run starts a job that polls every ~60s for ~55 minutes, then
# exits; the next hourly job continues. State is kept in the Actions cache
# (NOT committed to this public repo), so no personal data is ever exposed.
# Personal flight data + credentials come from encrypted repo secrets.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "serve = ~55-min live loop; once = single cycle; test = send a test alert"
        default: serve
        type: choice
        options: [serve, once, test]
  schedule:
    # Continuous cover: each job serves for ~2h55m and the concurrency group
    # keeps exactly one alive, so this cron is really a handoff/watchdog tick —
    # while a job is running the new run just waits and starts the instant the
    # old one exits (no window boundary to fall through), and if a job ever
    # dies the next tick revives it.
    #
    # Deliberately far more frequent than the handoff needs: GitHub's scheduler
    # is best-effort and silently drops ticks under load (observed here — five
    # consecutive hourly ticks never fired). Every tick is a fresh chance to
    # queue the successor, so a dense schedule is what makes the handoff
    # survive that. Ticks arriving while a job runs cost nothing: they queue,
    # and each is superseded by the next, which is why the Actions tab shows a
    # stream of "cancelled" runs. That is the mechanism working, not failing.
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Must exceed SERVE_MAX_SEC below so the loop exits on its own terms and
    # the state-saving step still runs. Hosted runners cap a job at 6h, and we
    # sit just under it: every handoff is a chance to fall in a hole, so the
    # fewer of them per day the better.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flight-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          # Primary channel; set the NOTIFY_CHANNEL repo variable to "telegram"
          # to switch. Whichever is not primary is used as an automatic fallback
          # if it is configured, so a throttled channel can't swallow an alert.
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'whatsapp' }}
          # ~5h45m, just inside the job timeout above: 4 handoffs a day instead
          # of 8, halving the exposure to a dropped scheduler tick. State is
          # cached when the job ends, so this also bounds how much state a hard
          # runner failure could cost.
          SERVE_MAX_SEC: "20700"
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          FLIGHTS_JSON: ${{ secrets.FLIGHTS_JSON }}
        run: |
          mode="${{ github.event.inputs.mode }}"
          mode="${mode:-serve}"
          python monitor.py --$mode

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: flight-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Deterministic handoff. GitHub's scheduler is best-effort and has been
      # observed dropping ~90% of ticks on this repo, which once left a 43-min
      # hole between jobs. Starting our own successor removes the scheduler
      # from the critical path; the cron above stays as a backstop.
      #
      # Entirely optional: with no HANDOFF_PAT secret this is a no-op and
      # nothing changes. It needs a PAT because the built-in GITHUB_TOKEN is
      # deliberately barred from triggering workflows.
      - name: Hand off to the next run
        if: always()
        env:
          HANDOFF_PAT: ${{ secrets.HANDOFF_PAT }}
        run: |
          if [ -z "$HANDOFF_PAT" ]; then
            echo "No HANDOFF_PAT secret — relying on the cron backstop."; exit 0
          fi
          # Only a run that served its whole window hands off. A crash on
          # startup, or an exit because every flight has landed, leaves no flag
          # and so ends the chain instead of spinning a hot loop.
          if [ ! -f .served-full-term ]; then
            echo "Did not serve a full term — not handing off."; exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $HANDOFF_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main","inputs":{"mode":"serve"}}')
          if [ "$code" = "204" ]; then
            echo "Successor dispatched."
          else
            echo "Handoff dispatch failed (HTTP $code) — cron backstop will recover."
          fi
